name: Compilar ReciboFacil
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar
        shell: cmd
        run: call build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: ReciboFacil-win-x64
          path: publicar/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ReciboFacil-win-x86
          path: publicar/win-x86
